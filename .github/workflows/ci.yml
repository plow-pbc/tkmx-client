name: CI

# Runs on every PR so a pull request can never again sit unverified. Also runs
# on pushes to main so the default branch keeps a green baseline to compare
# a PR against.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run pointless — cancel it rather than
# queueing behind it. Cancellation is scoped to PRs on purpose: main runs exist
# to give the default branch a green baseline, and two merges landing inside one
# run's duration would otherwise leave the earlier commit marked cancelled
# rather than green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Don't let one major's failure cancel the other — knowing whether a
      # break is version-specific or universal is the whole point of the matrix.
      fail-fast: false
      matrix:
        # 22 is the active LTS and the floor better-sqlite3 ^13 declares.
        # `current` tracks whatever major is newest, which is what developer
        # machines actually run. Testing only the LTS is how better-sqlite3 ^11
        # stayed green here while failing to build on Node 26 locally — 26 of
        # 272 tests dead at module load, invisible to this workflow.
        node: ['22', 'current']
    steps:
      # Pinned to the full commit SHA, not the `v7` tag: a tag is mutable, so a
      # retag upstream would run unreviewed code with this workflow's
      # permissions and write access to the tested workspace. The trailing
      # comment keeps the human-readable version; bump both together.
      # (v4 of each targeted the deprecated Node 20 action runtime — the runner
      # already forced them onto Node 24 and warned on every run.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Mirrors `just test`: a failed install is a setup failure, not a test
      # result, so it gets its own step. Without this the log reads as "tests
      # failed" when nothing was ever run.
      # Named for what it actually does: npm ci also runs the `prepare` script
      # (npm run build → tsc), so a TypeScript compile error reddens THIS step
      # and the Typecheck step below never runs. (better-sqlite3 ^13 carries
      # its prebuilds in the tarball and has no install script, so it is the
      # `prepare` build — not the native addon — that needs scripts to run.)
      - name: Install dependencies (npm ci also runs prepare → tsc build)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
